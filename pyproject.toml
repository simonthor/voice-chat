[project]
name = "voice-chat"
version = "0.1.0"
description = "Hands-free Claude Code with headphone buttons, Whisper and Piper"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Simon Thor", email = "simon11.thor@hotmail.se" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.168",
    "evdev>=2.0.0",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
    "piper-tts>=1.8.0",
]

[project.scripts]
voice-chat = "voice_chat.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
